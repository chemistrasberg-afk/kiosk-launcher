      }

      .reveal-toggle {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .tap-surface,
      .close-surface {
        position: fixed;
        inset: 0;
        cursor: pointer;
        touch-action: manipulation;
      }

      .tap-surface {
        z-index: 1;
      }

      .close-surface {
        z-index: 2;
        visibility: hidden;
        pointer-events: none;
        background: rgba(5, 20, 31, 0);
        transition: background-color 240ms ease, visibility 0s linear 240ms;
      }

      main {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        pointer-events: none;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(16px, 2.4vh, 26px);
        width: min(86vw, 100vh, 900px);
        opacity: 0;
        transform: translateY(16px) scale(0.92);
        visibility: hidden;
        transition:
          opacity 210ms ease,
          transform 270ms cubic-bezier(0.2, 0.82, 0.24, 1),
          visibility 0s linear 270ms;
      }

      .reveal-toggle:checked ~ .tap-surface {
        visibility: hidden;
        pointer-events: none;
      }

      .reveal-toggle:checked ~ .close-surface {
        visibility: visible;
        pointer-events: auto;
        background: rgba(5, 20, 31, 0.27);
        transition-delay: 0s;
      }

      .reveal-toggle:checked ~ main nav {
        opacity: 1;
        transform: translateY(0) scale(1);
        visibility: visible;
        pointer-events: auto;
        transition-delay: 0s;
      }

      body:has(.reveal-toggle:checked)::before {
        filter: blur(14px) saturate(0.82) brightness(0.8);
        transform: scale(1.055);
      }

      .tile {
        aspect-ratio: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(18px, 3vw, 30px);
        padding: clamp(26px, 4vw, 46px);
        border: 1px solid var(--line);
        border-radius: clamp(20px, 3vw, 34px);
        background: var(--tile);
        color: var(--ink);
        text-align: center;
        text-decoration: none;
        box-shadow: var(--shadow);
        touch-action: manipulation;
        transition: background-color 140ms ease, transform 140ms ease;
      }

      .tile:hover {
        background: #ffffff;
      }

      .tile:active {
        transform: translateY(2px);
      }

      .tile:focus-visible,
      .reveal-toggle:focus-visible ~ .tap-surface {
        outline: 6px solid var(--focus);
        outline-offset: 6px;
      }

      .icon {
        width: clamp(64px, 8vw, 94px);
        height: clamp(64px, 8vw, 94px);
        padding: 18px;
        border-radius: 50%;
        background: #eef3f6;
        box-shadow: inset 0 0 0 1px rgba(20, 50, 72, 0.08);
      }

      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .english {
        display: block;
        font-size: clamp(2rem, 4.4vw, 4.15rem);
        font-weight: 760;
        line-height: 0.98;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }

      .spanish {
        display: block;
        margin-top: 0.55em;
        font-size: clamp(1.15rem, 2.2vw, 1.85rem);
        font-weight: 570;
        line-height: 1.1;
        color: var(--muted);
      }

      @media (orientation: portrait) {
        body::before {
          background-position: 61% center;
        }

        nav {
          grid-template-columns: 1fr;
          width: min(68vw, 34vh, 390px);
          gap: clamp(16px, 2.4vh, 24px);
        }

        .tile {
          padding: clamp(20px, 5vw, 32px);
          gap: clamp(12px, 2vh, 20px);
        }

        .english {
          font-size: clamp(1.65rem, 8vw, 2.5rem);
        }

        .spanish {
          font-size: clamp(1rem, 4.5vw, 1.35rem);
        }

        .icon {
          width: clamp(54px, 14vw, 74px);
          height: clamp(54px, 14vw, 74px);
          padding: 14px;
        }
      }

      @media (max-height: 580px) and (orientation: landscape) {
        nav {
          width: min(88vw, 72vh, 572px);
          gap: 12px;
        }

        .tile {
          gap: 8px;
          padding: 14px;
        }

        .icon {
          width: 44px;
          height: 44px;
          padding: 10px;
        }

        .english {
          font-size: clamp(1.25rem, 4.5vh, 1.65rem);
        }

        .spanish {
          margin-top: 0.35em;
          font-size: clamp(0.82rem, 2.8vh, 1rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        .close-surface,
        nav,
        .tile {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
